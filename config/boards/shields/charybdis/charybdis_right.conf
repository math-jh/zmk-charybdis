CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_90=y
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3610_SCROLL_TICK=70
CONFIG_PMW3610_INVERT_X=y

# 250Hz overruns the 15ms BLE connection interval to the host and causes cursor jumps; keep 125Hz.
# Hardware 125Hz mode: the 125_SW variant buffers every other sample in software,
# which visibly hiccups slow/precise cursor movement.
CONFIG_PMW3610_POLLING_RATE_125=y

# Stay in RUN mode longer (default 128ms) and sample faster in REST1 (default 40ms):
# quick downshift made intermittent trackball motion start out at 25Hz = choppy cursor
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=500
# A/B: keep the sensor in RUN permanently. The stall correlates with
# resume-after-idle; rest-mode frames are long (REST2 ~100ms chip default,
# entered at ~10.5s idle with the values below), and a fast ball start
# between two long frames can exceed the optical correlation window --
# awake instantly, but tracking lost. If this kills the symptom, the rest
# transition is the cause; then choose between keeping this (battery: mA
# vs tens of uA) or tuning rest params to stay in fast-frame REST1.
CONFIG_PMW3610_FORCE_AWAKE=y
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=10
# Off: the datasheet smart algorithm exists to widen tracking across varied
# surfaces (granite, tiles). A trackball only ever sees one ball, so there
# is nothing to adapt to -- and the implementation toggles the sensor's
# tracking mode register 0x32 from inside the motion-read path on a single
# threshold with no hysteresis (shutter <45 off, >45 on), so a shutter
# sitting near 45 flips it every sample.
CONFIG_PMW3610_SMART_ALGORITHM=n

# CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=250

# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- diagnostics build 2026-08-11: split-contention hunt ---
# Ask the host for no peripheral latency. ZMK prefers 30 and macOS settled
# on 22, i.e. the right half may skip up to 22 of the 15ms connection
# events (330ms) before it must answer. Zero keeps it on every event.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# ZMK logs over a USB CDC ACM console. ZMK_USB is USB *HID* and is a
# separate symbol -- turning it off keeps HID on BLE, so the cable only
# carries the console. Otherwise plugging in moves the keyboard to USB
# HID and the BLE symptom cannot reproduce at all.
# ZMK_LOG_LEVEL already defaults to 4 (DBG), which is where the split
# central logs live: "Initiating new connection", "Stopping peripheral
# scanning", and "New connection params: Interval/Latency/PHY".
# ZMK_USB_LOGGING itself comes from the zmk-usb-logging snippet in
# build.yaml -- setting it here is not enough, because USB_CDC_ACM also
# needs the devicetree node the snippet's overlay adds.
CONFIG_ZMK_USB=n
