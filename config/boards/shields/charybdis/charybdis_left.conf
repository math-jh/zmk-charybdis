
# Left half only, so the right half falls back to the stock buffer counts
# (BT_BUF_ACL_TX_COUNT=3, BT_L2CAP_TX_BUF_COUNT=5 for a split central).
# Deep TX queues on the right turned dropped pointer reports into late
# bursts; for a cursor, latency is worse than loss. Keeping the left
# unchanged leaves its binary identical, so only the right needs flashing
# and the A/B has a single variable.
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
